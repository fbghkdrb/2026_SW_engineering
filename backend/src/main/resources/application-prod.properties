# ── 프로덕션 전용 설정 (spring.profiles.active=prod 로 활성화) ────────────────
# EC2 실행 시: java -jar wordtama.jar --spring.profiles.active=prod

# ── JPA ──────────────────────────────────────────────────────────────────────
# update → validate: 배포 시 Hibernate가 스키마를 변경하지 않음 (안전)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── MySQL (RDS SSL 강제) ──────────────────────────────────────────────────────
# DB_URL 환경변수에 RDS 엔드포인트 + useSSL=true 포함하여 설정
# 예: jdbc:mysql://wordtama.xxxx.ap-northeast-2.rds.amazonaws.com:3306/wordtama?useSSL=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
