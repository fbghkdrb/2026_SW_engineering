spring.application.name=wordtama

# ── MySQL (환경변수 필수: DB_URL, DB_USERNAME, DB_PASSWORD) ───────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wordtama?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1029}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP 커넥션 풀 ────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA (프로덕션은 application-prod.properties에서 오버라이드) ─────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ── JWT (환경변수 필수: JWT_SECRET — 운영 환경에서 반드시 설정) ───────────────
# 로컬 개발 전용 기본값: 운영 배포 시 반드시 강력한 랜덤값으로 교체
jwt.secret=${JWT_SECRET:wordtama-local-dev-only-secret-key-min-48-characters-long!!}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# ── CORS (환경변수: CORS_ALLOWED_ORIGINS) ────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
